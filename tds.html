<!doctype html>

<html>
<head>

<title>TDS-MODERN</title>
<meta charset="UTF-8">
<meta name="author" content="Soviet-Cat">
<meta name="description" content="Pixel-art style top-down shooter.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background-color: rgba(0, 0, 0, 1);
    margin: 0;
    padding: 0;
    overflow: hidden;
    cursor: none;
}

canvas {
    background-color: rgb(0, 0, 0, 1);
    width: 100vw;
    height: 100vh;
}
</style>

</head>
<body>

<canvas></canvas>

<script>
const tds = {
    toString() {
        return `"tds"`;
    },
    gl: null,
    webgl2: function() {
        return this.canvas.version === 2;
    },
    webgl: function() {
        return this.canvas.version === 1;
    },
    events: {
        toString() {
            return `"tds.events"`;
        },
        data: [],
        window: {},
        custom: {},
        isSubscribed: function(obj) {
            return this.data.indexOf(obj) !== -1;
        },
        subscribe: function(obj) {
            if (this.isSubscribed(obj)) {
                console.error(`Failed to subscribe ${obj} to ${this}. ${obj} is already subscribed.`);
                return;
            }

            this.data.push(obj);
        },
        unsubscribe: function(obj) {
            if (!this.isSubscribed(obj)) {
                console.error(`Failed to unsubscribe ${obj} from ${this}. ${obj} isn't subscribed.`);
                return;
            }
        },
        fireCustom: function(event) {
            const key = `_${event}`;
            for (const obj of this.data) {
                if (key in obj) {
                    obj[key]();
                }
            }
        },
        hasCustom: function(event) {
            return event in this.custom;
        },
        addCustom: function(event) {
            if (this.hasCustom(event)) {
                console.error(`Failed to add "${event}" to ${this}. "${event}" already exists.`);
                return;
            }

            this.custom[event] = function() { this.fireCustom(event); };
            this.custom[event] = this.custom[event].bind(this);
        },
        addCustoms: function(events) {
            for (const event of events) {
                this.addCustom(event);
            }
        },
        removeCustom: function(event) {
            if (!this.hasCustom(event)) {
                console.error(`Failed to remove "${event}" from ${this}. "${event}" doesn't exist.`);
                return;
            }

            delete this.custom[event];
        },
        triggerCustom: function(event) {
            if (!this.hasCustom(event)) {
                console.error(`Failed to trigger "${event}" from ${this}. "${event}" doesn't exist.`);
                return;
            }

            this.custom[event]();
        },
        fireWindow: function(name, event) {
            const key = `_${name}`;
            for (const obj of this.data) {
                if (key in obj) {
                    obj[key](event);
                }
            }
        },
        hasWindow: function(event) {
            return event in this.window;
        },
        addWindow: function(name) {
            if (this.hasWindow(name)) {
                console.error(`Failed to add "${name}" to ${this}. "${name}" already exists.`);
                return;
            }

            this.window[name] = function(event) { this.fireWindow(name, event); };
            this.window[name] = this.window[name].bind(this);
            window.addEventListener(name, this.window[name]);
        },
        addWindows: function(names) {
            for (const name of names) {
                this.addWindow(name);
            }
        },
        removeWindow: function(event) {
            if (!this.hasWindow(event)) {
                console.error(`Failed to remove "${event}" from ${this}. "${event}" doesn't exist.`);
                return;
            }

            window.removeEventListener(event, this.window[event]);
            delete this.window[event];
        }
    },
    keyboard: {
        toString() {
            return `"tds.keyboard"`;
        },
        data: {},
        pressed: function(key) {
            return this.data[key] === true;
        },
        release: function(key) {
            return this.data[key] === false;
        },
        _keydown: function(event) {
            this.data[event.key] = true;
        },
        _keyup: function(event) {
            this.data[event.key] = false;
        }
    },
    mouse: {
        toString() {
            return `"tds.mouse"`;
        },
        data: {},
        pressed: function(key) {
            return this.data[key] === true;
        },
        released: function(key) {
            return this.data[key] === false;
        },
        buttonToKey: function(button) {
            let key = "";
            switch (button) {
                case 0:
                    key = "left";
                    break;
                case 1:
                    key = "middle";
                    break;
                case 2:
                    key = "right";
                    break;
                default:
                    key = "unknown";
                    break;
            }
            return key;
        },
        _mousedown: function(event) {
            event.preventDefault();
            this.data[this.buttonToKey(event.button)] = true;
        },
        _mouseup: function(event) {
            event.preventDefault();
            this.data[this.buttonToKey(event.button)] = false;
        },
        _contextmenu: function(event) {
            event.preventDefault();
        }
    },
    canvas: {
        toString() {
            return `"tds.canvas"`;
        },
        element: null,
        context: null,
        version: 0,
        _load: function(event) {
            this.element = document.querySelector("canvas");

            this.context = this.element.getContext("webgl2");
            this.version = 2;
            if (!this.context) {
                console.warn(`${this} failed to get "webgl2" canvas context. Trying to find "webgl" canvas context instead.`);
                this.context = this.element.getContext("webgl");
                this.version = 1;
                if (!this.context) {
                    this.version = -1;
                    throw new Error(`${this} failed to "webgl" canvas context. `);
                }
            }

            tds.gl = this.context;

            this._resize(null);
        },
        _resize: function(event) {
            this.element.width = window.innerWidth;
            this.element.height = window.innerHeight;
        },
        _draw: function(event) {
            this.context.bindFramebuffer(this.context.FRAMEBUFFER, null);
            this.context.viewport(0, 0, this.element.width, this.element.height);
            this.context.clearColor(1, 0, 0, 1);
            this.context.clear(this.context.COLOR_BUFFER_BIT | this.context.DEPTH_BUFFER_BIT);
        }
    },
    loop: {
        toString() {
            return `"tds.loop"`;
        },
        frame: function() {
            tds.events.triggerCustom("update");
            tds.events.triggerCustom("draw");

            requestAnimationFrame(this.frame);
        },
        _load: function() {
            this.frame = this.frame.bind(this);
            requestAnimationFrame(this.frame);
        }
    }
};

// Window Events
tds.events.addWindows(["load", "unload", "resize", "keydown", "keyup", "mousedown", "mouseup", "contextmenu"]);
tds.events.addCustoms(["update", "draw"]);

// Event Subscribers
tds.events.subscribe(tds.keyboard);
tds.events.subscribe(tds.mouse);
tds.events.subscribe(tds.canvas);

// Start Loop
tds.events.subscribe(tds.loop);
</script>

</body>
</html>
